# Runs the legacy site locally with a throwaway stats database. The image is built from the
# 1.17.1 release tag on GitHub, so it stays a frozen reference of current production
# regardless of local changes in site/.
# Prerequisite: ./fetch-learn.sh
# Usage: docker compose up --build   ->   http://localhost:8080
name: taurus-site-legacy

services:
  site:
    build:
      context: .
      additional_contexts:
        site: https://github.com/Blazemeter/taurus.git#1.17.1:site
    platform: linux/amd64
    image: taurus-site:legacy
    ports:
      - "8080:80"
    environment:
      DB_CRED: /run/db_cred.json
    volumes:
      - ./db_cred.json:/run/db_cred.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: taurus
      POSTGRES_PASSWORD: taurus
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../aggregate_func.sql:/docker-entrypoint-initdb.d/02-aggregate_func.sql:ro
      - ./db/03-trigger.sql:/docker-entrypoint-initdb.d/03-trigger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taurus -d stats"]
      interval: 2s
      retries: 30
