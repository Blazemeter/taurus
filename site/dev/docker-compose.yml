# Local playground of the site using local clone of blazemeter/pwe.
# Runs next to the legacy baseline (legacy on :8080, this one on :8081).
# Prerequisite: ../legacy/fetch-learn.sh
# Usage: docker compose up --build   ->   http://localhost:8081
name: taurus-site-dev

services:
  site:
    build:
      context: ..
      dockerfile: dev/Dockerfile
      additional_contexts:
        pwe: ../../../pwe
    platform: linux/amd64
    image: taurus-site:dev
    ports:
      - "8081:80"
    environment:
      DB_CRED: /run/db_cred.json
    volumes:
      - ../legacy/db_cred.json:/run/db_cred.json:ro
      - ../../../pwe:/src/pwe
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: taurus
      POSTGRES_PASSWORD: taurus
    volumes:
      - ../legacy/db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../aggregate_func.sql:/docker-entrypoint-initdb.d/02-aggregate_func.sql:ro
      - ../legacy/db/03-trigger.sql:/docker-entrypoint-initdb.d/03-trigger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taurus -d stats"]
      interval: 2s
      retries: 30
